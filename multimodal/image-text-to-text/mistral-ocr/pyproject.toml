[project]
name = "mistral-ocr"
version = "0.1.0"
description = "CLI tool to convert documents and images to Markdown using the Mistral Document AI OCR API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mistralai>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
notebook = [
    "jupyterlab>=4.0.0",
    "ipykernel"
]

[project.scripts]
mistral-ocr = "mistral_ocr:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["mistral_ocr.py"]
