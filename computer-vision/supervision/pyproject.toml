[project]
name = "supervision-examples"
version = "0.1.0"
description = "Object detection and tracking examples on videos using Roboflow Supervision."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supervision[assets]>=0.26.0",
    "jupyterlab>=4.0.0",
    "ipykernel",
    "ipywidgets",
    "rfdetr>=1.11.0",
    "opencv-python>=5.0.0.93",
    "trackers>=2.6.1",
    "pandas>=3.0.6",
]
